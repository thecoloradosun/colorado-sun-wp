name: Deploy NewsroomOS plugin to Multiple Prod sites

concurrency: newsroomos-prod

permissions:
    contents: read
    actions: read

on:
    workflow_dispatch:
    push:
        branches:
            - release

jobs:
    Linting:
        uses: ./.github/workflows/linting.yml

    Deploy:
        name: FTP-Deploy-Action
        runs-on: ubuntu-latest
        needs: [Linting]
        env:
          PLUGIN_DEST: /htdocs/wp-content/plugins/newsroomos
          PLUGIN_SOURCE: /htdocs/wp-content/uploads/newsroomos__new
          PLUGIN_BACKUP: /htdocs/wp-content/plugins/newsroomos__bak
        if: ${{ vars.PROD_SITES != '' }}
        strategy:
            matrix:
                # Site names are defined in repository variable PROD_SITES
                # Example: PROD_SITES = ["SITE_1","SITE_2","SITE_3"]
                site_name: ${{ fromJSON(vars.PROD_SITES) }}
            fail-fast: false

        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 2

            - name: Use Node.js 18
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Build Project
              run: |
                  npm ci
                  npm run build --if-present

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '7.4'
                  tools: composer:v2

            - name: Install Composer dependencies
              run: composer install --no-dev --optimize-autoloader

            - name: Ensure remote directory exists
              env:
                SITE_USER: ${{ secrets[format('PROD_SFTP_USER_{0}', matrix.site_name)] }}
                SITE_PASS: ${{ secrets[format('PROD_SFTP_PASSWORD_{0}', matrix.site_name)] }}
              run: |
                sudo apt-get update -qq && sudo apt-get install -y -qq lftp
                lftp -u "$SITE_USER","$SITE_PASS" sftp://sftp.wp.com -e "
                  set sftp:connect-program 'ssh -o StrictHostKeyChecking=no'
                  set cmd:interactive no
                  cd /htdocs/wp-content/uploads
                  mkdir -p newsroomos__new
                  quit
                "

            - name: FTP-Deploy-Action to a new folder ${{ matrix.site_name }}
              uses: Automattic/FTP-Deploy-Action@3.1.2
              with:
                  ftp-server: sftp://sftp.wp.com${{ env.PLUGIN_SOURCE }}
                  ftp-username: ${{ secrets[format('PROD_SFTP_USER_{0}', matrix.site_name)] }}
                  ftp-password: ${{ secrets[format('PROD_SFTP_PASSWORD_{0}', matrix.site_name)] }}
                  git-ftp-args: --insecure

            - name: Atomic swap directories
              env:
                SITE_USER: ${{ secrets[format('PROD_SFTP_USER_{0}', matrix.site_name)] }}
                SITE_PASS: ${{ secrets[format('PROD_SFTP_PASSWORD_{0}', matrix.site_name)] }}
              run: |
                sudo apt-get update -qq && sudo apt-get install -y -qq lftp
                # Move existing plugin to backup (no-op on first deploy)
                lftp -u "$SITE_USER","$SITE_PASS" sftp://sftp.wp.com -e "
                  set sftp:connect-program 'ssh -o StrictHostKeyChecking=no'
                  set cmd:interactive no
                  mv $PLUGIN_DEST $PLUGIN_BACKUP
                  quit
                " || true
                # Copy uploads dir to plugin dir via runner (mv often fails across remote dirs on SFTP)
                lftp -u "$SITE_USER","$SITE_PASS" sftp://sftp.wp.com -e "
                  set sftp:connect-program 'ssh -o StrictHostKeyChecking=no'
                  set cmd:interactive no
                  lcd /tmp
                  mirror $PLUGIN_SOURCE plugin-deploy
                  mirror -R plugin-deploy $PLUGIN_DEST
                  rm -rf $PLUGIN_SOURCE
                  quit
                "
                # Remove backup (ignore error)
                lftp -u "$SITE_USER","$SITE_PASS" sftp://sftp.wp.com -e "
                  set sftp:connect-program 'ssh -o StrictHostKeyChecking=no'
                  set cmd:interactive no
                  rm -rf $PLUGIN_BACKUP
                  quit
                " || true

    DeployChildTheme:
        name: Deploy Child Theme to ${{ matrix.site_name }}
        runs-on: ubuntu-latest
        needs: [Linting]
        if: ${{ vars.PROD_SITES != '' }}
        strategy:
            matrix:
                site_name: ${{ fromJSON(vars.PROD_SITES) }}
            fail-fast: false

        steps:
            - uses: actions/checkout@v3

            - name: Deploy newspack-scott-child via SFTP
              env:
                SITE_USER: ${{ secrets[format('PROD_SFTP_USER_{0}', matrix.site_name)] }}
                SITE_PASS: ${{ secrets[format('PROD_SFTP_PASSWORD_{0}', matrix.site_name)] }}
              run: |
                sudo apt-get update -qq && sudo apt-get install -y -qq lftp
                lftp -u "$SITE_USER","$SITE_PASS" sftp://sftp.wp.com -e "
                  set sftp:connect-program 'ssh -o StrictHostKeyChecking=no'
                  set cmd:interactive no
                  lcd themes/newspack-scott-child
                  mirror -R --delete . /htdocs/wp-content/themes/newspack-scott-child
                  quit
                "